<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>阿龍记账</title><style>/* INLINE_STYLE */</style></head>
<body><main class="shell">
<header class="top"><div><h1>阿龍记账</h1><p class="muted">本地个人账本 · 人民币</p></div><div class="actions"><button id="refresh" class="secondary">刷新账本</button><button id="json" class="secondary">导出 JSON</button><button id="csv" class="secondary">导出 CSV</button></div></header>
<div id="notice" role="status" aria-live="polite"></div>
<section id="recovery" hidden><strong>有一项写入结果待确认</strong><p id="pendingText"></p><button id="queryPending">查询原请求</button><button id="retryPending" class="secondary" hidden>重发原请求</button></section>
<section aria-label="月度汇总" class="summary-section"><div class="section-head"><h2>月度收支</h2><label>月份 <input id="month" type="month" aria-label="汇总月份"></label></div><div class="summary"><div><span>支出</span><strong id="expense">—</strong></div><div><span>收入</span><strong id="income">—</strong></div><div><span>结余</span><strong id="net">—</strong></div><button id="goDue" class="secondary"><span>到期待确认</span><strong id="due">—</strong></button></div></section>
<nav class="tabs" aria-label="账本内容"><button data-tab="today" aria-pressed="true">今日账单</button><button data-tab="history" aria-pressed="false">全部账单</button><button data-tab="subscriptions" aria-pressed="false">订阅</button><button data-tab="categories" aria-pressed="false">分类统计</button></nav>
<div class="workspace"><section id="records" class="records"><div id="billControls" hidden><div class="filters"><label>从<input id="billFrom" type="date"></label><label>到<input id="billTo" type="date"></label><label>分类<select id="billCategory"><option value="">全部分类</option></select></label><button id="searchBills" class="secondary">查询</button></div></div><div id="subControls" class="filters" hidden><label>状态<select id="subStatus"><option value="all">全部</option><option value="active">启用</option><option value="paused">暂停</option><option value="archived">归档</option><option value="due">到期待确认</option></select></label><p class="muted">确认时默认记在本期到期日，账单可以随后编辑。</p></div><h2 id="listHeading">今日账单</h2><div id="list" aria-live="polite"><p class="empty">正在连接电脑上的账本…</p></div><div id="pager" class="pager"><button id="prev" class="secondary">上一页</button><span id="pageInfo"></span><button id="next" class="secondary">下一页</button></div></section>
<aside id="editor"><div class="editor-tabs"><button id="showBill" class="secondary" aria-pressed="true">记一笔</button><button id="showSub" class="secondary" aria-pressed="false">添加订阅</button></div>
<form id="bill" novalidate><h2 id="billTitle">记录账单</h2><div class="form-grid"><label>收支<select name="kind"><option value="expense">支出</option><option value="income">收入</option></select></label><label>金额（元）<input name="amount" inputmode="decimal" placeholder="0.00" required maxlength="14"></label><label>分类<select name="category"></select></label><label>日期<input name="occurredOn" type="date" required></label><label class="wide">备注<input name="note" maxlength="300" placeholder="例如：午餐"></label></div><p id="billError" class="error" role="alert"></p><div class="actions"><button type="submit" data-write>保存账单</button><button id="cancelBill" type="button" class="secondary" hidden>取消编辑</button></div></form>
<form id="subscription" hidden novalidate><h2 id="subTitle">添加订阅</h2><div class="form-grid"><label class="wide">名称<input name="name" maxlength="80" placeholder="例如：视频会员" required></label><label>金额（元）<input name="amount" inputmode="decimal" placeholder="0.00" required maxlength="14"></label><label>周期<select name="cycle"><option value="monthly">每月</option><option value="weekly">每周</option><option value="yearly">每年</option></select></label><label>分类<select name="category"></select></label><label>下次到期<input name="nextDue" type="date" required></label><label class="wide">备注<input name="note" maxlength="300" placeholder="可选"></label></div><p class="hint">按原始扣款日计算；月底与闰年会自动调整。到期后由你确认或跳过。</p><p id="subError" class="error" role="alert"></p><div class="actions"><button type="submit" data-write>保存订阅</button><button id="cancelSub" type="button" class="secondary" hidden>取消编辑</button></div></form>
<p id="draftStatus" class="hint"></p></aside></div>
<footer>账本保存在 Cindy Library。手机需要绑定的电脑在线；Cindy 完全关闭时不会检查到期提醒。请定期导出保留副本。</footer>
</main><script>/* INLINE_SCRIPT */</script></body></html>
